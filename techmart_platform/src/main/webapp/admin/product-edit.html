<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Edit Product</h1>
            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="product-list.html">Products</a>
                <a href="../logout.html">Logout</a>
            </nav>
        </header>
        <section class="card">
            <h2>Edit product details</h2>
            <div class="form-grid">
                <div>
                    <label for="productId">ID</label>
                    <input id="productId" disabled>
                </div>
                <div>
                    <label for="productName">Name</label>
                    <input id="productName">
                </div>
                <div>
                    <label for="productPrice">Price</label>
                    <input id="productPrice" type="number" step="0.01">
                </div>
                <div>
                    <label for="productStock">Stock</label>
                    <input id="productStock" type="number" min="0">
                </div>
            </div>
            <button onclick="saveProduct()">Save Changes</button>
            <div id="productMessage" class="message">Load a product to edit.</div>
        </section>
    </div>
    <script src="../common.js"></script>
    <script>
        const productId = getQueryParam('id');

        async function loadProduct() {
            if (!productId) {
                showMessage('productMessage', 'Product ID missing.', true);
                return;
            }
            const response = await fetch(api(`/api/products/${productId}`));
            if (!response.ok) {
                showMessage('productMessage', 'Unable to load product.', true);
                return;
            }
            const body = await response.json();
            const product = body.product || body;
            document.getElementById('productId').value = product.id;
            document.getElementById('productName').value = product.name;
            document.getElementById('productPrice').value = product.price;
            document.getElementById('productStock').value = product.stock;
            showMessage('productMessage', 'Product loaded. Edit and save.');
        }

        async function saveProduct() {
            const data = new URLSearchParams();
            data.append('name', document.getElementById('productName').value);
            data.append('price', document.getElementById('productPrice').value);
            data.append('stock', document.getElementById('productStock').value);

            const response = await fetch(api(`/api/products/${productId}`), {
                method: 'PUT',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: data.toString()
            });
            const result = await parseJson(response);
            showMessage('productMessage', result.message || (response.ok ? 'Saved successfully.' : 'Failed to save.'), !response.ok, true);
            if (response.ok) {
                setTimeout(() => window.location.href = appPath('admin/product-list.html'), 1200);
            }
        }

        requireLogin('../login.html').then(user => {
            if (!user) window.location.href = appPath('login.html');
            else if (user.role !== 'ADMIN') window.location.href = appPath('user/home.html');
            else loadProduct();
        });
    </script>
</body>
</html>
