<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Checkout</h1>
            <nav>
                <a href="home.html">Home</a>
                <a href="cart.html">Cart</a>
                <a href="orders.html">My Orders</a>
                <a href="../logout.html">Logout</a>
            </nav>
        </header>
        <section class="card">
            <h2>Confirm your order</h2>
            <p>Review your cart and submit your order.</p>
            <div id="addressInfo" style="display:none; background:var(--card-bg); border:1px solid var(--border); border-radius:8px; padding:12px 16px; margin-bottom:16px; color:var(--muted); font-size:0.92rem;">
                <strong>📦 Delivery to:</strong> <span id="deliveryAddress">—</span>
            </div>
            <div class="actions">
                <button onclick="placeOrder()">Place Order</button>
                <button class="secondary" onclick="window.location.href=appPath('user/cart.html')">Back to Cart</button>
            </div>
            <div id="checkoutMessage" class="message">Ready to place an order.</div>
        </section>
    </div>
    <script src="../common.js"></script>
    <script>
        async function placeOrder() {
            const response = await fetch(api('/api/checkout'));
            const result = await parseJson(response);
            if (!response.ok || !result.success) {
                const msg = result.message || 'Unable to place order';
                showMessage('checkoutMessage', msg, true, true);
                if (msg.includes('address')) {
                    setTimeout(() => window.location.href = appPath('user/profile.html'), 2000);
                }
                return;
            }
            showMessage('checkoutMessage', `Order placed: ${result.orderId || 'unknown'}. Status: ${result.status}`, false, true);
            if (result.orderId) {
                setTimeout(() => window.location.href = appPath('user/orders.html'), 1800);
            }
        }

        requireLogin('../login.html').then(user => {
            if (!user) return;
            if (user.role !== 'CUSTOMER') {
                window.location.href = appPath('login.html');
                return;
            }
            if (!user.address || user.address.trim() === '') {
                showMessage('checkoutMessage', '⚠ You have not set a delivery address. Redirecting to your profile…', true, true);
                setTimeout(() => window.location.href = appPath('user/profile.html'), 2500);
                return;
            }
            document.getElementById('deliveryAddress').textContent = user.address;
            document.getElementById('addressInfo').style.display = '';
        });
    </script>
</body>
</html>
